# Render Blueprint: one Docker web service + one managed Postgres.
# Create both at once via the Render dashboard -> "New" -> "Blueprint",
# pointed at this repo. After the first deploy creates the empty schema,
# load your existing data once with scripts/import_local_data.ps1.
# Current deployment notes live in docs/current-state.md.

databases:
  - name: inventory-db
    # Paid since 2026-08-09. The previous `free` plan expired after 90 days and
    # took the database with it; that clock is gone. This plan also provides
    # point-in-time recovery over a rolling 3-day window -- a recovery floor,
    # not an archive: anything discovered more than 3 days late is outside it.
    plan: basic-256mb
    databaseName: inventory
    user: inventory

services:
  - type: web
    name: inventory-app
    runtime: docker
    plan: free            # free web tier sleeps when idle (~30s cold start)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `/healthz` runs a trivial query against Postgres. This previously
    # pointed at `/`, which assembles the SPA shell from disk and never
    # touches the database -- so a deploy went green even when Postgres was
    # unreachable. Deploys that would have silently "succeeded" while broken
    # now fail here instead, which is the point.
    healthCheckPath: /healthz
    # CI is the only path to production: .github/workflows/ci.yml triggers a
    # deploy hook after the suite passes. With autoDeploy on, Render would also
    # deploy directly on push and race straight past that gate.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: SQL_ECHO
        value: "false"
      # Application log verbosity (app/logging_config.py). DEBUG can be
      # flipped on here without a code change; uvicorn's own access log is
      # independent of this and stays on.
      - key: LOG_LEVEL
        value: "INFO"
