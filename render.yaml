# Render Blueprint: one Docker web service wired to an existing managed
# Postgres instance. The production database is inventory-db-copy, referenced
# below by name through fromDatabase so credentials stay out of Git.
# Current deployment notes live in docs/current-state.md.

services:
  - type: web
    name: inventory-app
    runtime: docker
    plan: free            # free web tier sleeps when idle (~30s cold start)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `/healthz` runs a trivial query against Postgres. This previously
    # pointed at `/`, which assembles the SPA shell from disk and never
    # touches the database -- so a deploy went green even when Postgres was
    # unreachable. Deploys that would have silently "succeeded" while broken
    # now fail here instead, which is the point.
    healthCheckPath: /healthz
    # CI is the only path to production *from a git push*:
    # .github/workflows/ci.yml triggers a deploy hook after the suite passes.
    # With autoDeploy on, Render would also deploy directly on push and race
    # straight past that gate.
    #
    # It is NOT the only path to production overall, and this file used to say
    # it was. A Manual Deploy or a Blueprint sync from the Render dashboard
    # rebuilds the configured branch tip and runs no tests at all -- observed
    # on 2026-08-10, when a dashboard deploy shipped `eb7f4a2` 33 minutes after
    # the last CI run. Harmless there, because that commit had already passed
    # CI on its own push. The hazard is a dashboard deploy while `main` carries
    # unpushed or unverified work.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db-copy
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: SQL_ECHO
        value: "false"
      # Application log verbosity (app/logging_config.py). DEBUG can be
      # flipped on here without a code change; uvicorn's own access log is
      # independent of this and stays on.
      - key: LOG_LEVEL
        value: "INFO"
      # Hosted enrichment reads a per-user NetFacilities session captured through
      # Steel cloud sign-in (see STEEL_API_KEY and
      # NETFACILITIES_CLOUD_SESSION_ENCRYPTION_KEY, set via the dashboard's
      # Environment page since they're credentials, not committed here). This
      # value is repeated as a production-image default in backend/Dockerfile:
      # the deploy hook rebuilds the image but does not sync Blueprint environment
      # changes into an existing service. Keeping both declarations prevents a normal
      # gated deploy from silently leaving the capability disabled.
      - key: NETFACILITIES_ENABLED
        value: "true"
      # VAPID signing key for Web Push (app/services/push.py). Declared
      # here without a value -- `sync: false` means Render keeps the real
      # one in the dashboard's Environment page and never reads it from
      # Git. Unlike the NetFacilities settings above it is deliberately
      # NOT duplicated into backend/Dockerfile: that file is committed,
      # and this is a credential that can send notifications to every
      # subscriber.
      #
      # Rotating it invalidates every existing subscription, because the
      # browser bound the public half in at subscribe() time. Absent, push
      # simply stays off; nothing else in the app is affected.
      - key: VAPID_PRIVATE_KEY
        sync: false
