<!DOCTYPE html>
<!--
  SPA shell -- HEAD fragment.
  Layer: markup. The document served at `/` is assembled at request
  time by `app/main.py::read_root` (`_assemble_index`, in the order of
  `SHELL_PARTS`):

      shell-head.html        (this file: <head>, login, header/nav, <main>)
    + static/pages/*.html    (one file per page, in nav order)
    + shell-tail.html        (</main>, scan-confirm overlay, scripts, </body>)

  The former monolithic `index.html` was split this way so each page's
  markup can be edited in isolation. The assembled bytes are identical to
  the old single file, so runtime behavior is unchanged: every page's
  markup is present on boot, and `main.js` (loaded from shell-tail.html)
  wires all of them at startup.

  Structure only -- no inline scripts, no event handlers in attributes.
  All behavior lives in `/static/main.js` and the view modules under
  `/static/views/`.

  IDs used as the API contract between markup and JS are deliberately
  stable. Do not rename them without updating the matching view modules.
  The `.page` sections are toggled by
  `views/nav.js::showPage`, which adds the `active` class to the selected
  one.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFM</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <!-- Web Push on iPhone requires the site to be installed to the Home
         Screen, and iOS will not offer that without a manifest declaring
         `display: standalone`. The apple-touch-icon is what the installed
         icon uses; iOS ignores the manifest `icons` array for it. -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- =================== LOGIN SCREEN =================== -->
    <!-- Shown by auth.js when there is no valid session; hides the app
         entirely. Both this and #app-root start hidden, and auth.js
         reveals exactly one after checking /auth/me on boot. -->
    <div id="login-screen" hidden>
        <section id="login-section">
            <h1>TechFM</h1>
            <h2>Sign In</h2>
            <div class="form-stack">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" autocomplete="username" placeholder="Enter username">

                <label for="login-password">Password</label>
                <div class="password-field">
                    <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter password">
                    <button type="button" id="login-password-toggle" class="password-toggle-btn" aria-pressed="false" aria-label="Show password">Show</button>
                </div>

                <label class="checkbox-row" for="login-remember">
                    <input type="checkbox" id="login-remember"> Stay signed in for this shift
                </label>

                <button id="login-btn">Sign In</button>
                <p id="login-message"></p>
            </div>
        </section>
    </div>

    <!-- =================== APPLICATION =================== -->
    <div id="app-root" hidden>

    <header>
        <h1>TechFM</h1>
        <!-- Nav is grouped by task domain, not by role: Inventory / Field /
             People / Review. The groups are what make 11 buttons scannable
             for an Admin or Owner (a Technician only ever sees four, all in
             the first two groups).

             Icons are inline SVG on purpose. A4's CSP is `default-src 'self'`,
             so an icon font or a CDN sprite sheet would be blocked -- the same
             thing that leaves /docs and /redoc blank (N8). They use
             `stroke="currentColor"`, so they inherit the button's colour
             through idle / hover / active-red without any extra rules.

             `data-page` stays on the button: it is the contract `views/nav.js`
             reads. `applyRoleVisibility` hides individual buttons and then
             hides any group left with nothing visible in it. -->
        <nav id="main-nav">
            <div class="nav-group" data-nav-group="inventory">
                <button class="nav-btn" data-page="create-item"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M12 11v6M9 14h6"/></svg>Add Item</button>
                <button class="nav-btn" data-page="saved-items"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Find Item</button>
                <button class="nav-btn" data-page="tools"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3a5 5 0 0 0-4.6 7L3 17.4 6.6 21l7.4-7.4A5 5 0 0 0 21 9l-3 3-3-3 3-3a5 5 0 0 0-3-3z"/></svg>Tools</button>
            </div>
            <div class="nav-group" data-nav-group="field">
                <button class="nav-btn" data-page="transaction"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>Scan / Stock</button>
                <button class="nav-btn" data-page="work-orders"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg>Work Orders</button>
                <button class="nav-btn" data-page="mass-stage"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/></svg>Mass Stage</button>
            </div>
            <div class="nav-group" data-nav-group="people">
                <button class="nav-btn" data-page="create-user"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M18 8v6M15 11h6"/></svg>Add User</button>
                <button class="nav-btn" data-page="saved-users"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6M18 20a7 7 0 0 0-3-5.7"/></svg>Users</button>
            </div>
            <div class="nav-group" data-nav-group="review">
                <button class="nav-btn" data-page="user-requests"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></svg>User Requests</button>
                <button class="nav-btn" data-page="admin-review"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Admin Review</button>
                <button class="nav-btn" data-page="history"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 9A9 9 0 1 1 3 12"/><path d="M3 4v5h5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
            </div>
        </nav>
        <div id="auth-bar">
            <span id="auth-user-indicator"></span>
            <!-- Both start hidden and are revealed by role in
                 views/push.js::initPushForUser -- Admin and above for the
                 opt-in, Owner only for the test send. -->
            <button id="push-enable-btn" type="button" class="secondary-btn" hidden>Enable notifications</button>
            <button id="push-test-btn" type="button" class="secondary-btn" hidden>Send test</button>
            <button id="logout-btn" type="button" class="secondary-btn">Log Out</button>
        </div>
    </header>

    <main>
