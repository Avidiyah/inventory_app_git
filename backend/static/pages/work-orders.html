    <!-- =================== WORK ORDERS PAGE =================== -->
    <!-- Technician-facing work-order log. Static shell only: the collapsible
         work-order cards and their material rows are built by
         views/workOrders.js and toggled by views/nav.js (`.page.active`).
         Server-scoped (technician -> assigned, supervisor -> created,
         admin/owner -> all).

         Work orders are IMPORT-ONLY -- there is no create form here (or
         anywhere else). The CSV import below is how a work order enters the
         system; its imported fields are then editable per card in the
         collapsed "Edit details" card. See docs/current-state.md. -->
    <div class="page" id="work-orders-page">

        <section id="work-orders-controls-section">
            <h2>Work Orders</h2>
            <div class="wo-filter-grid" aria-label="Work order filters">
                <div class="wo-filter-field">
                    <!-- Field-help `?`: inside the label as an inline child,
                         never as a sibling -- see docs/superpowers/specs/
                         2026-08-23-tooltips-design.md. Copy lives in
                         static/tips.js; the markup carries only the key. -->
                    <label for="work-orders-status-filter">Status<button type="button" class="tip-btn" data-tip="wo.status">?</button></label>
                    <select id="work-orders-status-filter">
                        <option value="">All statuses</option>
                        <option value="created">Created</option>
                        <option value="assigned">Assigned</option>
                        <option value="in_progress">In-Progress</option>
                        <option value="on_hold">On-Hold</option>
                        <option value="ready_to_complete">Ready to Complete</option>
                        <option value="completed">Completed</option>
                        <option value="review">Review</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-service-filter">Service type</label>
                    <select id="work-orders-service-filter">
                        <option value="">All service types</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-priority-filter">Priority</label>
                    <select id="work-orders-priority-filter">
                        <option value="">All priorities</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <!-- One tip covers this filter and the Priority filter
                         above it; it is anchored here because "Priority level"
                         is the one people reach for by mistake. -->
                    <label for="work-orders-priority-level-filter">Priority level<button type="button" class="tip-btn" data-tip="wo.priority-vs-level">?</button></label>
                    <select id="work-orders-priority-level-filter">
                        <option value="">All priority levels</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-supervisor-filter">Assigned Supervisor</label>
                    <select id="work-orders-supervisor-filter">
                        <option value="">All supervisors</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-community-filter">Community<button type="button" class="tip-btn" data-tip="wo.community">?</button></label>
                    <select id="work-orders-community-filter">
                        <option value="">All communities</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-date-filter">Scheduled date<button type="button" class="tip-btn" data-tip="wo.scheduled-date">?</button></label>
                    <input id="work-orders-date-filter" type="date">
                </div>
            </div>
            <div class="filter-row wo-number-search-row">
                <label for="work-orders-search">Work order #</label>
                <input type="text" id="work-orders-search" placeholder="Search work order #">
                <button id="work-orders-search-btn" type="button">Search</button>
                <button id="work-orders-clear-filters" type="button" class="secondary-btn">Clear filters</button>
                <button id="wo-export-btn" type="button" class="secondary-btn" hidden>Export filtered CSV…</button>
            </div>
            <p id="work-orders-export-message"></p>
        </section>

        <section id="work-orders-list-section">
            <div id="work-orders-list"></div>
            <div id="work-orders-more" hidden></div>
            <p id="work-orders-list-message"></p>
        </section>

    </div>
