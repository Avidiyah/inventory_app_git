    <!-- =================== WORK ORDERS PAGE =================== -->
    <!-- Technician-facing work-order log. Static shell only: the collapsible
         work-order cards and their material rows are built by
         views/workOrders.js and toggled by views/nav.js (`.page.active`).
         Every recognised role sees every work order; a Technician off a work
         order's crew is read-only on it (see workOrderCardHtml.js).

         Work orders are IMPORT-ONLY -- there is no create form here (or
         anywhere else). The CSV import below is how a work order enters the
         system; its imported fields are then editable per card in the
         collapsed "Edit details" card. See docs/current-state.md. -->
    <div class="page" id="work-orders-page">

        <section id="work-orders-controls-section">
            <h2>Work Orders</h2>
            <!-- Scope: first thing on the page. Drives the same state as the
                 My Work Orders checkbox in the Advanced search panel (the
                 server's `mine`); workOrderList.js keeps the two in step. -->
            <div id="work-orders-scope" class="segmented wo-scope-seg" role="group" aria-label="Which work orders">
                <button type="button" class="seg-btn" data-scope="mine" aria-pressed="true">My Work Orders</button>
                <button type="button" class="seg-btn" data-scope="all" aria-pressed="false">All Work Orders</button>
            </div>
            <!-- Sort by scheduled date: a smaller copy of the scope toggle. -->
            <div id="work-orders-sort" class="segmented wo-sort-seg" role="group" aria-label="Sort by scheduled date">
                <button type="button" class="seg-btn" data-sort="scheduled_desc" aria-pressed="true">Newest first</button>
                <button type="button" class="seg-btn" data-sort="scheduled_asc" aria-pressed="false">Oldest first</button>
            </div>
            <!-- One search box over number, location and task (server text_q). -->
            <input type="search" id="work-orders-search" class="wo-search" placeholder="Search number, location or task" aria-label="Search work orders" autocomplete="off">
            <!-- Advanced search: a full-width bar in the style of the User Hub
                 picker. The panel opens inside the same box; the active-filter
                 count sits in the bar's label. -->
            <div class="wo-advanced-box">
                <button type="button" id="work-orders-filters-btn" class="wo-filters-btn" aria-expanded="false" aria-controls="work-orders-advanced">
                    <span class="wo-filters-ico" aria-hidden="true"></span>
                    <span class="wo-filters-text"><small>Narrow the list</small><b>Advanced search<span id="work-orders-filters-count" class="wo-filters-count" hidden></span></b></span>
                    <span class="wo-filters-chev" aria-hidden="true"></span>
                </button>
            <div id="work-orders-advanced" class="wo-advanced" hidden>
                <div class="wo-filter-grid" aria-label="Work order filters">
                <div class="wo-filter-field wo-filter-check">
                    <label for="work-orders-mine-filter"><input type="checkbox" id="work-orders-mine-filter" checked>My Work Orders</label>
                </div>
                <div class="wo-filter-field">
                    <!-- Field-help `?`: inside the label as an inline child,
                         never as a sibling -- see docs/superpowers/specs/
                         2026-08-23-tooltips-design.md. Copy lives in
                         static/tips.js; the markup carries only the key. -->
                    <label for="work-orders-status-filter">Status<button type="button" class="tip-btn" data-tip="wo.status">?</button></label>
                    <select id="work-orders-status-filter">
                        <option value="">All statuses</option>
                        <option value="created">Created</option>
                        <option value="planned">Planned</option>
                        <option value="assigned">Assigned</option>
                        <option value="in_progress">In-Progress</option>
                        <option value="on_hold">On-Hold</option>
                        <option value="ready_to_complete">Ready to Complete</option>
                        <option value="completed">Completed</option>
                        <option value="review">Review</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-service-filter">Service type</label>
                    <select id="work-orders-service-filter">
                        <option value="">All service types</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-priority-filter">Priority</label>
                    <select id="work-orders-priority-filter">
                        <option value="">All priorities</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-supervisor-filter">Assigned Team Lead</label>
                    <select id="work-orders-supervisor-filter">
                        <option value="">All Team Leads</option>
                    </select>
                </div>
                <!-- Team Lead+ only: hidden for a Technician. See
                     workOrderList.js's isSupervisorPlus() toggle. -->
                <div class="wo-filter-field" id="work-orders-technician-field" hidden>
                    <label for="work-orders-technician-filter">Assigned Technician</label>
                    <select id="work-orders-technician-filter">
                        <option value="">All technicians</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-community-filter">Community<button type="button" class="tip-btn" data-tip="wo.community">?</button></label>
                    <select id="work-orders-community-filter">
                        <option value="">All communities</option>
                    </select>
                </div>
                <div class="wo-filter-field">
                    <label for="work-orders-date-filter">Scheduled date<button type="button" class="tip-btn" data-tip="wo.scheduled-date">?</button></label>
                    <input id="work-orders-date-filter" type="date">
                </div>
            </div>
                <div class="wo-filters-actions">
                    <button id="work-orders-clear-filters" type="button" class="secondary-btn">Clear filters</button>
                </div>
            </div>
            </div>
            <button id="wo-export-btn" type="button" class="secondary-btn wo-export-btn" hidden>Export CSV…</button>
            <p id="work-orders-export-message"></p>
            <!-- Applied-filter chips + result count, filled after each list
                 load by views/workOrderFilterChips.js. -->
            <div id="work-orders-filter-chips" class="wo-filter-chips" aria-label="Applied filters" hidden></div>
            <p id="work-orders-result-count" class="wo-result-count" aria-live="polite" hidden></p>
        </section>

        <section id="work-orders-list-section">
            <div id="work-orders-list" class="wo-list"></div>
            <p id="work-orders-list-message"></p>
        </section>

    </div>
