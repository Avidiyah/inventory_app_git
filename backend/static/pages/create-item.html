    <!-- =================== CREATE ITEM PAGE =================== -->
    <!-- Item and Tool are sub-nav tabs (views/subnav.js), one feature-panel
         visible at a time -- same convention as Saved Items' Find/Scan. -->
    <div class="page" id="create-item-page">

        <nav class="sub-nav" aria-label="Add Item or Tool">
            <button type="button" class="sub-nav-btn active" data-feature="item">Item</button>
            <button type="button" class="sub-nav-btn" data-feature="tool">Tool</button>
        </nav>

        <section class="feature-panel" data-feature="item" id="create-item-section">
            <h2>Add Item</h2>
            <div class="form-stack">
                <label for="barcode">Barcode<button type="button" class="tip-btn" data-tip="item.barcode">?</button></label>
                <div class="filter-row">
                    <input type="text" id="barcode" placeholder="Scan or enter barcode">
                    <button type="button" id="item-scan-toggle-btn">Scan</button>
                </div>
                <p class="hint">Scan or type the label number.</p>

                <div class="scan-controls" id="item-scan-controls" hidden>
                    <input type="file" id="item-scan-input" accept="image/*" capture="environment">
                    <div class="scan-viewport">
                        <video id="item-scan-video" class="scan-video" playsinline muted autoplay></video>
                        <div id="item-scan-aimbox" class="scan-aimbox" role="presentation" hidden></div>
                    </div>
                    <div class="scan-toolbar">
                        <button id="item-scan-scan-btn" type="button">Scan Barcode</button>
                        <button id="item-scan-upload-btn" type="button" class="secondary-btn">Upload Photo</button>
                        <button id="item-scan-torch-btn" type="button" class="secondary-btn" hidden>Torch</button>
                    </div>
                    <div id="item-scan-chooser" class="scan-chooser" hidden></div>
                    <p id="item-scan-message"></p>
                </div>

                <label for="name">Item Name</label>
                <input type="text" id="name" placeholder="Enter item name">

                <label for="location">Location<button type="button" class="tip-btn" data-tip="item.location">?</button></label>
                <input type="text" id="location" placeholder="Enter location">
                <p class="hint">Where workers will find it.</p>

                <label for="quantity">Starting Quantity</label>
                <input type="number" id="quantity" placeholder="0" min="0" value="0">

                <label for="price">Price (optional)<button type="button" class="tip-btn" data-tip="item.price">?</button></label>
                <input type="number" id="price" placeholder="0.00" min="0" step="0.01">

                <label for="product-link">Product Link (optional)<button type="button" class="tip-btn" data-tip="item.product-link">?</button></label>
                <input type="url" id="product-link" placeholder="Enter product link">

                <button id="create-item-btn">Save Item</button>
                <p id="create-item-message"></p>
            </div>
        </section>

        <section class="feature-panel" data-feature="tool" id="create-tool-section" hidden>
            <h2>Add Tool</h2>
            <div class="form-stack">
                <label for="tool-barcode">Barcode<button type="button" class="tip-btn" data-tip="tool.barcode">?</button></label>
                <div class="filter-row">
                    <input type="text" id="tool-barcode" placeholder="Scan or enter barcode">
                    <button type="button" id="tool-scan-toggle-btn">Scan</button>
                </div>
                <p class="hint">Scan or type the label number.</p>

                <div class="scan-controls" id="tool-scan-controls" hidden>
                    <input type="file" id="tool-scan-input" accept="image/*" capture="environment">
                    <div class="scan-viewport">
                        <video id="tool-scan-video" class="scan-video" playsinline muted autoplay></video>
                        <div id="tool-scan-aimbox" class="scan-aimbox" role="presentation" hidden></div>
                    </div>
                    <div class="scan-toolbar">
                        <button id="tool-scan-scan-btn" type="button">Scan Barcode</button>
                        <button id="tool-scan-upload-btn" type="button" class="secondary-btn">Upload Photo</button>
                        <button id="tool-scan-torch-btn" type="button" class="secondary-btn" hidden>Torch</button>
                    </div>
                    <div id="tool-scan-chooser" class="scan-chooser" hidden></div>
                    <p id="tool-scan-message"></p>
                </div>

                <label for="tool-name">Tool Name</label>
                <input type="text" id="tool-name" placeholder="Enter tool name">

                <label for="tool-quantity">Quantity<button type="button" class="tip-btn" data-tip="tool.quantity">?</button></label>
                <input type="number" id="tool-quantity" placeholder="1" min="0" value="1">
                <p class="hint">Use 1 for a single serialized tool, or a higher count for an unserialized batch.</p>

                <button id="create-tool-btn">Save Tool</button>
                <p id="create-tool-message"></p>
            </div>
        </section>

    </div>
