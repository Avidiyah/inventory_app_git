    </main>

    <!-- Scan-and-go per-scan confirmation. Shown by views/transactions.js
         (confirmScan) when a scan resolves to an item; Yes commits the
         transaction, No/Esc/backdrop cancels. App-level so it overlays
         every page. Toggled via the `hidden` attribute (the global
         [hidden]{display:none!important} rule beats .modal-overlay's flex). -->
    <div id="scan-confirm-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="scan-confirm-title">
            <p id="scan-confirm-title" class="modal-title"></p>
            <!-- Optional quantity stepper (#11): shown by dom.js confirmDialog
                 only when called with a { quantity } option (the scan-and-go
                 confirm), so the operator adjusts the count here instead of the
                 page field below the camera. Hidden for every other confirm. -->
            <div id="scan-confirm-qty" class="scan-confirm-qty" hidden>
                <button type="button" id="scan-confirm-qty-dec" class="qty-step-btn" aria-label="Decrease quantity">&minus;</button>
                <input type="number" id="scan-confirm-qty-input" class="qty-step-input" min="0" step="any" inputmode="decimal" aria-label="Quantity">
                <button type="button" id="scan-confirm-qty-inc" class="qty-step-btn" aria-label="Increase quantity">+</button>
            </div>
            <div class="modal-buttons">
                <button id="scan-confirm-yes">Yes, save</button>
                <button id="scan-confirm-no" type="button" class="secondary-btn">No</button>
            </div>
        </div>
    </div>

    <!-- Password-reset prompt. Shown by dom.js promptPasswordReset() (used by
         views/users.js) in place of the old native prompt(): two fields (new +
         confirm) with a show/hide toggle and live validation, so a typo can't
         silently lock a user out. App-level overlay, same hidden-toggle
         mechanics as the scan-confirm modal above. -->
    <div id="pw-reset-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pw-reset-title">
            <p id="pw-reset-title" class="modal-title"></p>
            <div class="form-stack">
                <label for="pw-reset-new">New password</label>
                <div class="password-field">
                    <input type="password" id="pw-reset-new" autocomplete="new-password" placeholder="At least 4 characters">
                    <button type="button" id="pw-reset-toggle" class="password-toggle-btn" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <label for="pw-reset-confirm">Confirm password</label>
                <input type="password" id="pw-reset-confirm" autocomplete="new-password" placeholder="Re-enter password">
                <p id="pw-reset-message" aria-live="polite"></p>
            </div>
            <div class="modal-buttons">
                <button id="pw-reset-save">Save password</button>
                <button id="pw-reset-cancel" type="button" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Explicit name/username editor for legacy accounts and later
         corrections. The username field changes the login name, so it is
         shown only to callers dom.js is told may edit it. -->
    <div id="user-name-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="user-name-title">
            <p id="user-name-title" class="modal-title">Edit user name</p>
            <div class="form-stack">
                <label for="user-name-first">First Name</label>
                <input type="text" id="user-name-first" autocomplete="given-name">
                <label for="user-name-last">Last Name</label>
                <input type="text" id="user-name-last" autocomplete="family-name">
                <label for="user-name-username" id="user-name-username-label">Username</label>
                <input type="text" id="user-name-username" autocomplete="username">
                <p id="user-name-username-help" class="hint">Used to sign in. Changing it does not change the password.</p>
                <p id="user-name-message" aria-live="polite"></p>
            </div>
            <div class="modal-buttons">
                <button id="user-name-save">Save name</button>
                <button id="user-name-cancel" type="button" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Role editor for the Users page (Admin+). The select is filled by
         dom.js promptUserRole() with only the roles the current user may
         assign; the backend re-checks. -->
    <div id="user-role-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="user-role-title">
            <p id="user-role-title" class="modal-title">Edit user role</p>
            <div class="form-stack">
                <label for="user-role-select">Role</label>
                <select id="user-role-select"></select>
                <p id="user-role-modal-help" class="hint"></p>
                <p id="user-role-message" aria-live="polite"></p>
            </div>
            <div class="modal-buttons">
                <button id="user-role-save">Save role</button>
                <button id="user-role-cancel" type="button" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    </div><!-- /#app-root -->

    <!-- Urgent work-order fire (see .wo-card-urgent / .wo-priority-fire in
         styles.css). `filter: url(#id)` resolves against the current
         document, so the primitives have to live in the markup rather than
         the stylesheet -- and they live here, at app level, because the
         assembled shell is one document and a work-order card renders on
         four of its pages (Work Orders, Transaction gate, Admin Review,
         Technician Hub).

         The `<animate>` elements are the flicker itself: CSS can animate a
         `filter` property but not a filter primitive's attributes, so
         moving the turbulence field is only possible from here. SMIL is
         markup, not script -- it neither breaks the no-inline-script rule
         for this file nor trips the CSP.

         Cost is deliberate and was accepted: a displacement map repaints
         its region every frame. It is bounded by there being a handful of
         urgent work orders in the database at a time, and by the fire going
         out at Completed. -->
    <svg class="wo-fire-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <!-- Card outline. Wide filter region so the flames may lick well
                 past the element's own box before they are clipped. -->
            <filter id="wo-fire-card" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.013 0.03" numOctaves="3" seed="4" result="fire">
                    <animate attributeName="baseFrequency" dur="4.7s" values="0.013 0.03;0.02 0.048;0.011 0.026;0.013 0.03" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="fire" xChannelSelector="R" yChannelSelector="G" scale="18">
                    <animate attributeName="scale" dur="2.9s" values="18;25;15;18" repeatCount="indefinite"/>
                </feDisplacementMap>
                <feGaussianBlur stdDeviation="1.1"/>
            </filter>
            <!-- The Urgent pill. A pill is a fraction of a card's size, so it
                 needs its own finer noise and a smaller displacement -- the
                 card's values on this scale smear it into a blur. -->
            <filter id="wo-fire-badge" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.04 0.09" numOctaves="2" seed="11" result="fire">
                    <animate attributeName="baseFrequency" dur="3.1s" values="0.04 0.09;0.06 0.13;0.035 0.08;0.04 0.09" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="fire" xChannelSelector="R" yChannelSelector="G" scale="7">
                    <animate attributeName="scale" dur="1.9s" values="7;10;5;7" repeatCount="indefinite"/>
                </feDisplacementMap>
                <feGaussianBlur stdDeviation=".6"/>
            </filter>
        </defs>
    </svg>

    <!--
      Vendored @zxing/browser UMD. Loaded as a plain (non-module)
      script so it attaches `ZXingBrowser` to `window` synchronously
      before the deferred `main.js` module evaluates. The only
      consumer is `scan/barcode-decoder.js`. See docs/current-state.md
      for the pinned dependency and why this is loaded globally.
    -->
    <script src="/static/vendor/zxing-browser-0.2.0.umd.min.js"></script>
    <script type="module" src="/static/main.js"></script>
</body>
</html>
