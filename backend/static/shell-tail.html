    </main>

    <!-- Scan-and-go per-scan confirmation. Shown by views/transactions.js
         (confirmScan) when a scan resolves to an item; Yes commits the
         transaction, No/Esc/backdrop cancels. App-level so it overlays
         every page. Toggled via the `hidden` attribute (the global
         [hidden]{display:none!important} rule beats .modal-overlay's flex). -->
    <div id="scan-confirm-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="scan-confirm-title">
            <p id="scan-confirm-title" class="modal-title"></p>
            <!-- Optional quantity stepper (#11): shown by dom.js confirmDialog
                 only when called with a { quantity } option (the scan-and-go
                 confirm), so the operator adjusts the count here instead of the
                 page field below the camera. Hidden for every other confirm. -->
            <div id="scan-confirm-qty" class="scan-confirm-qty" hidden>
                <button type="button" id="scan-confirm-qty-dec" class="qty-step-btn" aria-label="Decrease quantity">&minus;</button>
                <input type="number" id="scan-confirm-qty-input" class="qty-step-input" min="0" step="any" inputmode="decimal" aria-label="Quantity">
                <button type="button" id="scan-confirm-qty-inc" class="qty-step-btn" aria-label="Increase quantity">+</button>
            </div>
            <div class="modal-buttons">
                <button id="scan-confirm-yes">Yes, save</button>
                <button id="scan-confirm-no" type="button" class="secondary-btn">No</button>
            </div>
        </div>
    </div>

    <!-- Password-reset prompt. Shown by dom.js promptPasswordReset() (used by
         views/users.js) in place of the old native prompt(): two fields (new +
         confirm) with a show/hide toggle and live validation, so a typo can't
         silently lock a user out. App-level overlay, same hidden-toggle
         mechanics as the scan-confirm modal above. -->
    <div id="pw-reset-overlay" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pw-reset-title">
            <p id="pw-reset-title" class="modal-title"></p>
            <div class="form-stack">
                <label for="pw-reset-new">New password</label>
                <div class="password-field">
                    <input type="password" id="pw-reset-new" autocomplete="new-password" placeholder="At least 4 characters">
                    <button type="button" id="pw-reset-toggle" class="password-toggle-btn" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <label for="pw-reset-confirm">Confirm password</label>
                <input type="password" id="pw-reset-confirm" autocomplete="new-password" placeholder="Re-enter password">
                <p id="pw-reset-message" aria-live="polite"></p>
            </div>
            <div class="modal-buttons">
                <button id="pw-reset-save">Save password</button>
                <button id="pw-reset-cancel" type="button" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    </div><!-- /#app-root -->

    <!--
      Vendored @zxing/browser UMD. Loaded as a plain (non-module)
      script so it attaches `ZXingBrowser` to `window` synchronously
      before the deferred `main.js` module evaluates. The only
      consumer is `scan/barcode-decoder.js`. See docs/current-state.md
      for the pinned dependency and why this is loaded globally.
    -->
    <script src="/static/vendor/zxing-browser-0.2.0.umd.min.js"></script>
    <script type="module" src="/static/main.js"></script>
</body>
</html>
